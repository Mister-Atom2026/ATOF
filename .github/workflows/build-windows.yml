name: Build Windows + Linux installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the beta release with installers'
        required: true
        default: 'v0.9.1-beta.2'
  push:
    tags:
      - 'v0.9.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow
      - name: Generate Windows icon
        run: python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build exe
        run: python -m PyInstaller --noconfirm ATOF.spec
      - name: Verify
        run: |
          if (!(Test-Path "dist/ATOF.exe")) { throw "ATOF.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: ATOF-windows-x64
          path: dist/ATOF.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build binary
        run: python -m PyInstaller --noconfirm ATOF.spec
      - name: Verify
        run: |
          test -f dist/ATOF || { echo "ATOF binary was not produced"; exit 1; }
          chmod +x dist/ATOF
      - uses: actions/upload-artifact@v4
        with:
          name: ATOF-linux-x64
          path: dist/ATOF
          if-no-files-found: error

  package-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATOF-windows-x64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Generate icon
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Create Inno Setup script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppName=ATOF
          AppVersion=0.9.1
          AppPublisher=Mister-Atom2026
          DefaultDirName={autopf}\ATOF
          DefaultGroupName=ATOF
          OutputDir=installer
          OutputBaseFilename=ATOF-setup
          SetupIconFile=icon.ico
          UninstallDisplayIcon={app}\ATOF.exe
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: dist\ATOF.exe; DestDir: {app}; Flags: ignoreversion

          [Icons]
          Name: {group}\ATOF; Filename: {app}\ATOF.exe; IconFilename: {app}\ATOF.exe
          Name: {autodesktop}\ATOF; Filename: {app}\ATOF.exe; IconFilename: {app}\ATOF.exe
          '@ | Set-Content -Encoding UTF8 build-setup.iss
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc /Qp build-setup.iss
          if (!(Test-Path "installer\ATOF-setup.exe")) { throw "Installer was not produced" }
          Get-Item "installer\ATOF-setup.exe" | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ATOF-windows-installer
          path: installer/ATOF-setup.exe
          if-no-files-found: error

  package-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATOF-linux-x64
          path: artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build .deb package
        run: |
          set -e
          python -m pip install pillow
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps out
          cp artifacts/ATOF pkg/usr/bin/atof
          chmod 755 pkg/usr/bin/atof
          python - <<'PY'
          from PIL import Image
          img = Image.open('icon.png').convert('RGBA')
          img = img.resize((256, 256), Image.LANCZOS)
          img.save('pkg/usr/share/icons/hicolor/256x256/apps/atof.png')
          PY
          cat > pkg/DEBIAN/control <<'EOF'
          Package: atof
          Version: 0.9.1
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Mister-Atom2026 <atom.core92@gmail.com>
          Description: Game About Mister Atom
           ATOF open-world game.
          EOF
          cat > pkg/usr/share/applications/atof.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ATOF
          Comment=Game About Mister Atom
          Exec=atof
          Icon=atof
          Categories=Game;
          Terminal=false
          EOF
          dpkg-deb --build --root-owner-group pkg out/atof_0.9.1_amd64.deb
          ls -lh out/atof_0.9.1_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ATOF-linux-deb
          path: out/atof_0.9.1_amd64.deb
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p out
          cp artifacts/ATOF-windows-x64/ATOF.exe out/ATOF-windows-x64.exe
          cp artifacts/ATOF-linux-x64/ATOF out/ATOF-linux-x64
          cp artifacts/ATOF-windows-installer/ATOF-setup.exe out/ATOF-setup.exe
          cp artifacts/ATOF-linux-deb/atof_0.9.1_amd64.deb out/atof_0.9.1_amd64.deb
          chmod +x out/ATOF-linux-x64
          ls -lh out/
      - name: Publish pre-release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ATOF beta build (installers for Windows + Linux)
          prerelease: true
          generate_release_notes: true
          files: |
            out/ATOF-setup.exe
            out/ATOF-windows-x64.exe
            out/atof_0.9.1_amd64.deb
            out/ATOF-linux-x64
