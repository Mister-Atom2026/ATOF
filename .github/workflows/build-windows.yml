name: Build Windows x64 executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (x64)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ATOF.spec

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/ATOF.exe")) { throw "ATOF.exe was not produced" }
          Get-Item "dist/ATOF.exe" | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATOF-windows-x64
          path: dist/ATOF.exe
          if-no-files-found: error
